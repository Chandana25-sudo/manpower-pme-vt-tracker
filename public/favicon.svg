<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Base App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />

  <!-- Subtle Inner Glow/Ring (Tracker background) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="24" />
  
  <!-- Active Compliance Ring (100% Green Tracker) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10B981" stroke-width="32" opacity="0.15" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" />

  <!-- CENTRAL ELEMENT: Compliance Clipboard -->
  <rect x="176" y="126" width="160" height="200" rx="16" fill="#F1F5F9" />
  <rect x="226" y="110" width="60" height="24" rx="8" fill="#64748B" />
  <!-- Clipboard Data Lines -->
  <line x1="200" y1="160" x2="312" y2="160" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="190" x2="280" y2="190" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />

  <!-- CENTRAL ELEMENT: Coal Miner Hard Hat (Manpower) -->
  <g id="miner-helmet">
    <!-- Helmet Dome -->
    <path d="M 186 280 C 186 200, 216 170, 256 170 C 296 170, 326 200, 326 280 Z" fill="#F59E0B" />
    <!-- Helmet Brim -->
    <path d="M 156 280 L 356 280 C 376 280, 376 300, 356 300 L 156 300 C 136 300, 136 280, 156 280 Z" fill="#D97706" />
    <!-- Center Ridge -->
    <path d="M 256 170 V 230" stroke="#B45309" stroke-width="8" stroke-linecap="round" />
    <!-- Headlamp Base -->
    <rect x="236" y="230" width="40" height="30" rx="8" fill="#B45309" />
    <!-- Headlamp Light -->
    <rect x="242" y="236" width="28" height="18" rx="4" fill="#FEF08A" />
  </g>

  <!-- TOP NODE: Tracker / Search -->
  <g id="node-tracker">
    <circle cx="256" cy="96" r="36" fill="#1E293B" stroke="#0F172A" stroke-width="8" />
    <!-- Magnifying Glass Icon -->
    <circle cx="251" cy="91" r="10" fill="none" stroke="#94A3B8" stroke-width="4" />
    <line x1="258" y1="98" x2="267" y2="107" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- LEFT NODE: PME (Periodical Medical Examination) -->
  <g id="node-pme">
    <circle cx="96" cy="256" r="52" fill="#1E293B" stroke="#0F172A" stroke-width="8" />
    <circle cx="96" cy="256" r="40" fill="#FEE2E2" />
    <!-- Medical Cross -->
    <path d="M 91 241 H 101 V 251 H 111 V 261 H 101 V 271 H 91 V 261 H 81 V 251 H 91 Z" fill="#EF4444" />
  </g>

  <!-- RIGHT NODE: VT (Vocational Training) -->
  <g id="node-vt">
    <circle cx="416" cy="256" r="52" fill="#1E293B" stroke="#0F172A" stroke-width="8" />
    <circle cx="416" cy="256" r="40" fill="#E0F2FE" />
    <!-- Open Book Icon -->
    <path d="M 416 270 C 402 270 392 276 392 276 V 242 C 392 242 402 236 416 236 C 430 236 440 242 440 242 V 276 C 440 276 430 270 416 270 Z" fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round" />
    <line x1="416" y1="236" x2="416" y2="270" stroke="#0284C7" stroke-width="5" stroke-linecap="round" />
    <!-- Book Pages Detail -->
    <path d="M 398 250 C 404 247 410 247 410 247 M 434 250 C 428 247 422 247 422 247" stroke="#0284C7" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- BOTTOM NODE: Compliance Status -->
  <g id="node-status">
    <circle cx="256" cy="416" r="52" fill="#1E293B" stroke="#0F172A" stroke-width="8" />
    <circle cx="256" cy="416" r="40" fill="#10B981" />
    <!-- Bold Checkmark -->
    <path d="M 242 416 L 252 426 L 274 404" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>
